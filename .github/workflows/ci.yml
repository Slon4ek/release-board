name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ворота merge (Ruleset требует check). Lint + typecheck + тесты.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: release_board_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_board_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    env:
      MODE: TEST
      DB_NAME: release_board_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

  # Сборка образа + скан. Намеренно падает при HIGH/CRITICAL (остаток
  # разобран в docs/report.md, этап 3) — merge не держит, виден в пайплайне.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: release-board
      TAG: ci-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: make docker-build IMAGE=$IMAGE TAG=$TAG

      - name: Trivy scan (HIGH/CRITICAL = fail)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/.trivy:/root/.cache \
            aquasec/trivy:0.75.0 image --exit-code 1 \
            --severity HIGH,CRITICAL $IMAGE:$TAG

  # Проверка chart'а: lint + рендер через kubeconform закреплённой версии.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KUBECONFORM_VERSION: "0.8.0"
      K8S_VERSION: "1.35.5"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint
        run: helm lint deploy/helm/release-board

      - name: helm template | kubeconform
        run: |
          helm template rb deploy/helm/release-board \
            | kubeconform -strict -summary -kubernetes-version ${K8S_VERSION}
          helm template rb deploy/helm/release-board \
            --show-only templates/migrate-job.yaml \
            | kubeconform -strict -summary -kubernetes-version ${K8S_VERSION}

  # Упаковка OCI-архивов — ТОЛЬКО для SemVer-тега.
  # Не зависит от docker: известный остаток Trivy не должен блокировать релиз.
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, helm]
    env:
      IMAGE: release-board

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build image (same sources as tag)
        run: make docker-build IMAGE=$IMAGE TAG=$APP_VERSION

      - name: Docker save + gzip
        run: |
          docker save $IMAGE:$APP_VERSION | gzip > ${IMAGE}-${APP_VERSION}.tar.gz

      - name: helm package
        run: |
          helm package deploy/helm/release-board --destination .

      - name: Check artifacts content
        run: |
          echo "--- chart contents:"
          tar -tzf release-board-${APP_VERSION}.tgz | sort
          echo "--- image size:"
          ls -lh ${IMAGE}-${APP_VERSION}.tar.gz

      - name: SHA256 checksums
        run: |
          sha256sum ${IMAGE}-${APP_VERSION}.tar.gz release-board-${APP_VERSION}.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.APP_VERSION }}
          path: |
            ${{ env.IMAGE }}-${{ env.APP_VERSION }}.tar.gz
            release-board-${{ env.APP_VERSION }}.tgz
            SHA256SUMS
          retention-days: 90