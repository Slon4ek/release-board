apiVersion: v1
kind: Secret
metadata:
  name: release-board-db
  namespace: release-board-raw
type: Opaque
stringData:            # stringData — plaintext на входе, API-сервер сам
  DB_USER: "release_board"      # закодирует в base64 при сохранении
  DB_PASSWORD: "CHANGE_ME"      # сюда подставляется сгенерированный пароль
  DB_NAME: "release_board"