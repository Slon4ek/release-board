# Миграции схемы: alembic upgrade head на том же образе, что и API.
# post-install — ждёт, пока стенд встанет (включая postgres);
# pre-upgrade — гоняет миграции ДО раскатки новых Pod'ов;
# при helm rollback НЕ выполняется (rollback не откатывает данные).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "release-board.fullname" . }}-migrate
  labels:
    {{- include "release-board.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "release-board.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              i=0
              until python -m alembic upgrade head; do
                i=$((i+1))
                if [ "$i" -ge 36 ]; then
                  echo "migrate: БД не ответила за 3 минуты" >&2
                  exit 1
                fi
                echo "migrate: ждём postgres... попытка $i"
                sleep 5
              done
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "release-board.fullname" . }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "release-board.fullname" . }}-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret.name }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret.name }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret.name }}
                  key: DB_NAME
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}