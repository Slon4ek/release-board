apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "release-board.fullname" . }}-config
  labels:
    {{- include "release-board.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  MODE: {{ .Values.config.MODE | quote }}
  DB_HOST: {{ printf "%s-postgres" (include "release-board.fullname" .) | quote }}
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: {{ printf "%s-kafka:9092" (include "release-board.fullname" .) | quote }}
  RELAY_TOPIC: {{ .Values.kafka.topics.events.name | quote }}
  DLQ_TOPIC: {{ .Values.kafka.topics.dlq.name | quote }}