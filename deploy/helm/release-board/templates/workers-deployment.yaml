# Relay: поллер outbox_events → Kafka. Тот же образ, что и api,
# другая команда. Требует postgres (читает outbox) и kafka (пишет).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "release-board.fullname" . }}-relay
  labels:
    {{- include "release-board.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  replicas: {{ .Values.workers.replicas }}
  selector:
    matchLabels:
      {{- include "release-board.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        {{- include "release-board.labels" . | nindent 8 }}
        app.kubernetes.io/component: relay
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: "{{ include "release-board.imageRef" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "src.relay"]
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "release-board.fullname" . }}-config
                  key: MODE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "release-board.fullname" . }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "release-board.fullname" . }}-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret.name }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret.name }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecret.name }}
                  key: DB_NAME
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "release-board.fullname" . }}-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: RELAY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "release-board.fullname" . }}-config
                  key: RELAY_TOPIC
          resources:
            requests:
              cpu: {{ .Values.workers.resources.requests.cpu }}
              memory: {{ .Values.workers.resources.requests.memory }}
            limits:
              cpu: {{ .Values.workers.resources.limits.cpu }}
              memory: {{ .Values.workers.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Notifier: подписчик release.events.v1 (faststream) → processed_events,
# NOTIFY в лог, DLQ для кривых/необработанных. Требует postgres и kafka.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "release-board.fullname" . }}-notifier
  labels:
    {{- include "release-board.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
spec:
  replicas: {{ .Values.workers.replicas }}
  selector:
    matchLabels:
      {{- include "release-board.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notifier
  template:
    metadata:
      labels:
        {{- include "release-board.labels" . | nindent 8 }}
        app.kubernetes.io/component: notifier
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
