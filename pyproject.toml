[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-board"
version = "0.1.0"
description = "Release tracking board with FastAPI and async PostgreSQL"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Author", email = "author@example.com" }
]

dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "SQLAlchemy[asyncio]==2.1.3",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "alembic==1.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-dotenv==0.5.2",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
  "pyright==1.1.414",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
reportUnusedImport = true
reportDuplicateImport = true
